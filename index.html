<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalibrasi Mesin Potong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--surface:#ffffff;--subtle:#f8fafc;--subtle2:#f1f5f9;
  --ink:#0f172a;--ink2:#334155;--mute:#64748b;--line:#e2e8f0;--line2:#cbd5e1;
  --pri:#2563eb;--pri-d:#1d4ed8;--pri-50:#eff6ff;--pri-100:#dbeafe;
  --ok:#15803d;--ok-50:#f0fdf4;--ok-100:#dcfce7;
  --warn:#b45309;--warn-50:#fffbeb;--warn-100:#fef3c7;
  --bad:#b91c1c;--bad-50:#fef2f2;--bad-100:#fee2e2;
  --vio:#7c3aed;--org:#ea580c;
  --r:12px;--r-sm:8px;--sh:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- header & tabs ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:12px 20px 0}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--pri);display:grid;place-items:center;flex:none}
.brand h1{font-size:17px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;color:var(--mute);font-size:12.5px}
.brand .sp{flex:1}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:10px 14px;font-weight:600;font-size:13.5px;color:var(--mute);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink2)}
.tab[aria-selected="true"]{color:var(--pri);border-bottom-color:var(--pri)}
.count{background:var(--subtle2);color:var(--ink2);border-radius:999px;padding:0 7px;font-size:11.5px;font-weight:600;line-height:18px}
.tab[aria-selected="true"] .count{background:var(--pri-100);color:var(--pri-d)}

/* ---------- layout ---------- */
main{max-width:1120px;margin:0 auto;padding:20px 20px 80px}
.view{display:none}.view.on{display:block}
@media(max-width:860px){}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15px;margin:0;font-weight:600}
.card-h .desc{color:var(--mute);font-size:12.5px;margin:1px 0 0;font-weight:400}
.card-h .sp{flex:1}
.card-b{padding:16px 18px}
.card-f{padding:12px 18px;border-top:1px solid var(--line);background:var(--subtle);border-radius:0 0 var(--r) var(--r);color:var(--mute);font-size:12.5px}

/* ---------- controls ---------- */
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:0 0 5px}
.field .help{font-size:12px;color:var(--mute);margin-top:4px}
.inp,select.inp{width:100%;height:38px;border:1px solid var(--line2);border-radius:var(--r-sm);padding:0 11px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-100)}
.inp-lg{height:48px;font-size:20px;font-weight:600}
.unit{position:relative}.unit .inp{padding-right:40px}.unit::after{content:"mm";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:12.5px;pointer-events:none}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line2);background:#fff;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--subtle)}
.btn-pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn-pri:hover{background:var(--pri-d)}
.btn-ghost{border-color:var(--pri-100);background:var(--pri-50);color:var(--pri-d)}.btn-ghost:hover{background:var(--pri-100);border-color:#bfdbfe}
.btn-danger{color:var(--bad)}.btn-danger.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px}
.icon-btn{width:30px;height:30px;padding:0;justify-content:center;border-color:transparent;background:transparent;color:var(--mute)}
.icon-btn:hover{background:var(--bad-50);color:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-100);color:var(--ok)}.p-warn{background:var(--warn-100);color:var(--warn)}.p-bad{background:var(--bad-100);color:var(--bad)}.p-gray{background:var(--subtle2);color:var(--mute)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:#fff}
.kpi .l{font-size:12px;color:var(--mute);font-weight:500}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.kpi .s{font-size:11.5px;color:var(--mute)}

/* ---------- hero result ---------- */
.hero{border-radius:var(--r);background:var(--pri-50);border:1px solid var(--pri-100);padding:18px;text-align:center;margin-top:14px}
.hero .l{font-size:12.5px;color:var(--ink2)}
.hero .v{font-size:34px;font-weight:700;color:var(--pri-d);letter-spacing:-.02em;line-height:1.2;margin:4px 0}
.hero .v small{font-size:16px;font-weight:600;color:var(--pri)}
.hero.bad{background:var(--bad-50);border-color:var(--bad-100)}.hero.bad .v{color:var(--bad);font-size:20px}
.meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.meta span{font-size:12.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.note{display:flex;gap:8px;align-items:flex-start;border-radius:var(--r-sm);padding:9px 12px;font-size:13px;margin-top:10px;text-align:left}
.note.warn{background:var(--warn-50);border:1px solid var(--warn-100);color:#78350f}
.note.info{background:var(--subtle);border:1px solid var(--line);color:var(--ink2)}
.note svg{flex:none;margin-top:2px}
.formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;background:var(--subtle);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;margin:6px 0;overflow-x:auto}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0 0;font-size:13.5px}
dl.kv dt{color:var(--mute)}dl.kv dd{margin:0;font-weight:500}

/* ---------- table ---------- */
.chart-model{display:grid;grid-template-columns:minmax(0,1fr)}
.cm-chart{padding:16px 18px;min-width:0}
.cm-model{padding:14px 18px 16px;border-top:1px solid var(--line);background:var(--subtle);border-radius:0 0 var(--r) var(--r)}
.cm-model{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:10px 18px!important}
.cm-model .cm-t{margin:0!important;font-size:13.5px;white-space:nowrap}
#modelBox{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;flex:1;min-width:0}
.cm-model .formula{margin:0;padding:4px 10px;font-size:12.5px;background:#fff}
.cm-model dl.kv{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:0;font-size:12.5px}
.cm-model dl.kv dt{margin-right:-8px}
.cm-model dl.kv dt::after{content:":"}
.cm-model .pill{font-size:11.5px;padding:1px 8px}
.cm-model .note{margin:0;padding:3px 10px;font-size:12px;flex-basis:100%;background:transparent;border:0;color:var(--mute)}
.cm-model .note svg{width:13px;height:13px;margin-top:1px}
.cm-t{font-size:15px;font-weight:600;margin:0}

.grid-find{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:16px;align-items:start}
.grid-find .hero{padding:12px 14px;margin-top:10px}.grid-find .hero .v{font-size:27px}.grid-find .hero .meta{gap:6px}.grid-find .hero .meta span{font-size:12px}
.grid-find .inp-lg{height:42px;font-size:18px}.grid-find .note{font-size:12.5px;padding:8px 10px}
@media(max-width:960px){.grid-find{grid-template-columns:minmax(0,1fr)}}
.tw-scroll{overflow:visible}
.tbl-card table.t{table-layout:fixed;width:100%}
.tbl-card .t td,.tbl-card .t th{padding:8px 10px;white-space:normal;word-break:normal;overflow-wrap:anywhere;font-size:13px}
.tbl-card .t th{position:static;font-size:12px;line-height:1.3;vertical-align:bottom;overflow-wrap:normal;hyphens:auto}
@media(max-width:600px){.tbl-card .t td,.tbl-card .t th{padding:8px 6px;font-size:12px}.tbl-card .t th{font-size:11px}.tbl-card .t th:last-child{overflow-wrap:anywhere}}
.tbl-card .t th:nth-child(1){width:30%}.tbl-card .t th:nth-child(2){width:20%}.tbl-card .t th:nth-child(3){width:30%}.tbl-card .t th:nth-child(4){width:20%}
.tw{overflow-x:auto}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
.t th{position:sticky;top:0;background:var(--subtle);color:var(--ink2);font-weight:600;font-size:12.5px;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:var(--subtle)}
.t tr.hl td{background:var(--pri-50)}
.t .num{text-align:right}
.t .strong{font-weight:700}
.t .muted{color:var(--mute)}

/* ---------- data entry ---------- */
.set-list{display:flex;flex-direction:column;gap:10px}
.set{border:1px solid var(--line);border-radius:var(--r);background:#fff;position:relative}
#grpBody .set:not(.open) .cells{display:none}
#grpBody .set:not(.open) .set-h{border-bottom:0}
.set .tog{border:0;background:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;cursor:pointer;flex:none}
.set .tog:hover{background:var(--subtle2)}
.set .tog .chev{width:7px;height:7px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .2s}
.set.open .tog .chev{transform:rotate(45deg);margin-top:-3px}
.set .gm{color:var(--ink2)}
.set .ck{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;display:none;place-items:center;box-shadow:0 0 0 3px #fff;z-index:1}
.set.done{background:var(--ok-50);border-color:#bbf7d0}
.set.done .ck{display:grid}
.set.done .set-h{border-bottom-color:#bbf7d0}
.set-h{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-h .lab{font-size:12px;color:var(--mute);font-weight:600}
.set-h .unit{width:100%}.set-h>.unit{width:120px}.set-h .inp{height:34px;font-weight:700}.set-h .field{min-width:120px}
.prog{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.bar{flex:1;height:6px;background:var(--subtle2);border-radius:99px;overflow:hidden;max-width:160px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .2s}
.cells{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;padding:12px 14px}
@media(max-width:760px){.cells{grid-template-columns:repeat(4,1fr)}}
.cell{display:flex;flex-direction:column;gap:3px}
.cell span{font-size:11px;color:var(--mute);font-weight:500}
.cell .cl{display:flex;align-items:center;justify-content:space-between}
.cdel{border:0;background:none;color:#94a3b8;font-size:15px;line-height:1;width:18px;height:18px;border-radius:4px;cursor:pointer;padding:0}
.cdel:hover{background:var(--bad-50);color:var(--bad)}
.cell .inp{height:34px;padding:0 8px;text-align:right}
.inp.okv{border-color:#86efac;background:#fcfffd}
.inp.bad{border-color:#fca5a5;background:var(--bad-50)}
.empty{text-align:center;padding:36px 16px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* ---------- steps / suggestions ---------- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
@media(max-width:760px){.steps{grid-template-columns:1fr}}
.step{border:1px solid var(--line);border-radius:var(--r);background:#fff;position:relative;transition:border-color .15s,background .15s}
.step-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:12px 14px;cursor:pointer;border-radius:var(--r)}
.step-h:hover{background:var(--subtle)}
.step-h .tx{flex:1;min-width:0}
.step-h .st{font-size:12px;color:var(--mute);margin-top:1px}
.step-h .chev{width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s;margin:0 4px 4px;flex:none}
.step.open .step-h .chev{transform:rotate(-135deg);margin-bottom:-2px}
.step-b{display:none;padding:0 14px 12px}
.step.open .step-b{display:block}
.step .ck{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:none;place-items:center;box-shadow:0 0 0 3px #fff}
.step.done{background:var(--ok-50);border-color:#bbf7d0}
.step.done .ck{display:grid}
.step.done .no{color:var(--ok)}
.step.done .st{color:var(--ok);font-weight:600}
.step.done .step-h:hover{background:transparent}
.step.cur{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-50)}
.step .no{font-size:11.5px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.04em}
.step h3{margin:2px 0 2px;font-size:14px}
.step p{margin:0 0 8px;font-size:12.5px;color:var(--mute)}
.step .cnt{display:inline-block;background:var(--pri-100);color:var(--pri-d);border-radius:999px;padding:0 8px;font-weight:600;font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--pri-100);background:var(--pri-50);color:var(--pri-d);border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip:hover{background:var(--pri-100)}
.done{font-size:12.5px;color:var(--ok);font-weight:600}

/* ---------- details ---------- */
details.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:14px 18px;font-weight:600;font-size:15px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s}
details.acc[open]>summary::after{transform:rotate(-135deg)}
details.acc[open]>summary{border-bottom:1px solid var(--line)}
textarea.inp{height:auto;min-height:110px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}

/* ---------- chart ---------- */
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--mute);cursor:pointer}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--pri-50);color:var(--pri-d)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.legend i.lm{width:14px;height:3px;border-radius:2px;vertical-align:3px}
.legend i.ld{width:6px;height:6px;border-radius:50%;vertical-align:1px}
.legend i.ll{width:14px;height:0;border-radius:0;vertical-align:3px;background:none}
svg.chart{width:100%;height:auto;display:block}
#chart{position:relative}
.ctip{position:absolute;display:none;pointer-events:none;background:#0f172a;color:#fff;border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.45;box-shadow:0 6px 20px rgba(15,23,42,.25);white-space:nowrap;z-index:5}
.ctip .tm{color:#cbd5e1}
#chart [data-t]{cursor:pointer}
#chart circle.dot.on-hover{r:5;fill:#475569;fill-opacity:1}
#chart circle.mean.on-hover{r:7;fill:#2563eb}

#chart rect.hz.on-hover{fill-opacity:.14}


/* ---------- banner & toast ---------- */
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-50);border:1px solid var(--warn-100);color:#78350f;border-radius:var(--r);padding:10px 14px;font-size:13.5px;margin-bottom:16px}
.banner .sp{flex:1}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px rgba(15,23,42,.25);opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--bad)}
.errline{color:var(--bad);font-size:13px;font-weight:600;margin-top:8px}
.vsum{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:600px){.brand p{display:none}.topbar-in{padding:10px 14px 0}main{padding:16px 14px 80px}.banner{flex-wrap:wrap}.card-h,.card-b{padding-left:14px;padding-right:14px}.hero .v{font-size:30px}.set-h .field{flex:1}}

.lang{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin-left:8px;flex:none}
.lang button{border:0;background:#fff;padding:5px 10px;font-size:12px;font-weight:600;color:var(--mute);cursor:pointer}
.lang button+button{border-left:1px solid var(--line2)}
.lang button[aria-pressed="true"]{background:var(--pri);color:#fff}
@media(max-width:600px){#dataBadge{display:none}.lang button{padding:5px 8px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg></div>
      <div><h1 data-i="brand.title"></h1><p data-i="brand.sub"></p></div>
      <div class="sp"></div>
      <span id="dataBadge" class="pill p-gray">Data</span>
      <div class="lang" role="group" aria-label="Language"><button data-lang="id">ID</button><button data-lang="en">EN</button><button data-lang="zh">中文</button></div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="hasil"><span data-i="tab.hasil"></span></button>
      <button class="tab" role="tab" data-view="data"><span data-i="tab.data"></span> <span class="count" id="cntData">0</span></button>
      <button class="tab" role="tab" data-view="verifikasi"><span data-i="tab.ver"></span> <span class="count" id="cntVer">0</span></button>
      <button class="tab" role="tab" data-view="pengaturan"><span data-i="tab.set"></span></button>
    </nav>
  </div>
</header>

<main>
  <div id="banner" class="banner hidden">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span class="sp" data-ih="banner.txt"></span>
    <button class="btn btn-sm" data-go="data" data-i="banner.btn"></button>
  </div>

<script>
/* ===== LOGIKA ===== */
const num=v=>Number(String(v).trim().replace(',','.'));
function parseData(txt){
  const pts=[];let bad=0;
  for(const raw of txt.split(/\r?\n/)){
    const line=raw.trim();if(!line)continue;
    const tok=(/[\t; ]/.test(line)?line.split(/[\t; ]+/):line.split(',')).filter(t=>t!=='');
    const n=tok.map(num);
    if(n.every(isNaN))continue;
    if(n.some(isNaN)||n.length<2){bad++;continue;}
    pts.push({sp:n[0],ac:n[n.length-1]});
  }
  return {pts,bad};
}
function cekNilai(v,sp){if(v===''||v==null)return 'empty';const x=num(v);if(!isFinite(x))return 'nan';if(sp>0&&Math.abs(x-sp)/sp>0.1)return 'far';return 'ok';}

function stats(groups){
  return groups.map(g=>{
    const v=g.vals.filter(x=>{const s=cekNilai(x,g.sp);return s==='ok'||s==='far';}).map(num);
    if(!v.length)return null;
    const m=v.reduce((a,b)=>a+b,0)/v.length,mn=Math.min(...v),mx=Math.max(...v);
    return {sp:g.sp,n:v.length,total:g.vals.length,vals:v,mean:m,min:mn,max:mx,range:mx-mn,sel:m-g.sp};
  }).filter(Boolean).sort((a,b)=>a.sp-b.sp);
}
// interpolasi min/max hasil pada setting s (hanya di dalam rentang uji)
function pred(S,s){
  for(let i=0;i<S.length;i++){if(S[i].sp===s)return {min:S[i].min,max:S[i].max,tested:true,g:S[i]};}
  for(let i=0;i<S.length-1;i++){const a=S[i],b=S[i+1];if(s>a.sp&&s<b.sp){const t=(s-a.sp)/(b.sp-a.sp);return {min:a.min+t*(b.min-a.min),max:a.max+t*(b.max-a.max),tested:false};}}
  return null;
}
// cari rentang setting aman untuk pesanan P
function fitLine(S){
  const pts=[];S.forEach(g=>g.vals.forEach(v=>pts.push([g.sp,v])));
  const n=pts.length,mx=pts.reduce((s,p)=>s+p[0],0)/n,my=pts.reduce((s,p)=>s+p[1],0)/n;
  let sxx=0,sxy=0,syy=0;pts.forEach(([x,y])=>{sxx+=(x-mx)**2;sxy+=(x-mx)*(y-my);syy+=(y-my)**2;});
  const b=sxx?sxy/sxx:1,a=my-b*mx,r2=syy?(sxy*sxy)/(sxx*syy):1;
  const res=pts.map(([x,y])=>y-(a+b*x));
  const maxDev=Math.max(...S.map(g=>Math.abs(g.mean-(a+b*g.sp))));
  return {a,b,r2,rMin:Math.min(...res),rMax:Math.max(...res),maxDev,n};
}
const LURUS_MAKS=5; // mm: penyimpangan rata-rata per setting dari garis
function makeModel(S,mode,rmin,rmax){
  const fit=S.length>=2?fitLine(S):null;
  const lurus=!!fit&&S.length>=3&&fit.maxDev<=LURUS_MAKS;
  const use=mode==='rumus'?'rumus':mode==='interp'?'interp':(lurus?'rumus':'interp');
  const tested=new Set(S.map(x=>x.sp));
  if(use==='rumus'&&fit){
    const lo=Math.min(S[0].sp,Math.round((rmin-fit.a)/fit.b))-100,hi=Math.max(S[S.length-1].sp,Math.round((rmax-fit.a)/fit.b))+100;
    return {use,fit,lurus,s0:lo,s1:hi,f:s=>{const m=fit.a+fit.b*s;return {min:m+fit.rMin,max:m+fit.rMax,tested:tested.has(s)};}};
  }
  return {use:'interp',fit,lurus,s0:Math.ceil(S[0].sp),s1:Math.floor(S[S.length-1].sp),f:s=>pred(S,s)};
}
function safeRange(S,P,tolMin,tolPlus,M){
  if(S.length<1)return {segs:[],out:true};
  const lo=P-tolMin,hi=P+tolPlus,s0=M.s0,s1=M.s1;
  const segs=[];let cur=null;
  for(let s=s0;s<=s1;s++){
    const p=M.f(s);const ok=p&&p.min>=lo-1e-9&&p.max<=hi+1e-9;
    if(ok){if(!cur)cur={a:s,b:s,tested:[]};cur.b=s;if(p.tested)cur.tested.push(s);}
    else if(cur){segs.push(cur);cur=null;}
  }
  if(cur)segs.push(cur);
  segs.forEach(sg=>{sg.mid=Math.round((sg.a+sg.b)/2);sg.endsTested=S.some(x=>x.sp===sg.a)&&S.some(x=>x.sp===sg.b);sg.inData=sg.a>=S[0].sp&&sg.b<=S[S.length-1].sp;});
  // apakah pesanan di luar jangkauan data
  const minRes=Math.min(...S.map(x=>x.min)),maxRes=Math.max(...S.map(x=>x.max));
  return {segs,lo,hi,out:!segs.length&&(hi<minRes||lo>maxRes)};
}
function suggestions(S,rmin,rmax,lookupRows){
  const tested=new Set(S.map(x=>x.sp));const t1=[],t2=new Set(),t3=new Set();
  for(let i=0;i<S.length-1;i++){
    const a=S[i],b=S[i+1],jump=Math.abs(b.sel-a.sel),gap=b.sp-a.sp;
    if(jump<=5)continue;
    if(gap>10){for(let s=Math.ceil((a.sp+1)/10)*10;s<b.sp;s+=10)if(!tested.has(s))t2.add(s);}
    else if(gap>1){const m=Math.round((a.sp+b.sp)/2);if(!tested.has(m))t3.add(m);}
  }
  (lookupRows||[]).forEach(r=>r&&r.segs&&r.segs.forEach(sg=>{[sg.a,sg.b].forEach(e=>{if(!tested.has(e))t3.add(e);});}));
  t2.forEach(s=>t3.delete(s));
  return {t1,t2:[...t2].sort((a,b)=>a-b),t3:[...t3].sort((a,b)=>a-b)};
}
</script>

let LANG='id';
try{const sv=localStorage.getItem('kmp_lang');if(sv&&I18N[sv])LANG=sv;}catch(e){}
function t(k,v){let s=(I18N[LANG]&&I18N[LANG][k])??I18N.id[k]??k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s;}
const LOC={id:'id-ID',en:'en-US',zh:'zh-CN'};
function applyStatic(){
  document.documentElement.lang=LANG==='zh'?'zh-CN':LANG;
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.dataset.i);});
  document.querySelectorAll('[data-ih]').forEach(e=>{e.innerHTML=t(e.dataset.ih);});
  document.querySelectorAll('[data-iph]').forEach(e=>{e.placeholder=t(e.dataset.iph);});
  document.title=t('brand.title');
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===LANG?'true':'false'));
}


/* ===== TAMPILAN ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(v,d=1)=>isFinite(v)?v.toLocaleString(LOC[LANG],{maximumFractionDigits:d,useGrouping:false}):'-';
const sgn=(v,d=1)=>(v>0?'+':'')+fmt(v,d);
const mn=a=>a<0?'+ '+fmt(-a,2):'− '+fmt(a,2);
const ICON_WARN='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';

let GROUPS=[],VERS=[],LAST={},isContoh=false,tAuto=null;

/* --- toast --- */
let tT=null;function toast(t,err){const el=$('toast');el.textContent=t;el.className='toast on'+(err?' err':'');clearTimeout(tT);tT=setTimeout(()=>el.className='toast'+(err?' err':''),2600);}

/* --- tab --- */
const VIEWS=['hasil','data','verifikasi','pengaturan'];
function go(v){if(!VIEWS.includes(v))v='hasil';const bb=document.querySelector('#banner [data-go]');if(bb)bb.classList.toggle('hidden',v==='data');VIEWS.forEach(x=>$('v-'+x).classList.toggle('on',x===v));
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.view===v?'true':'false'));
  if(location.hash!=='#'+v){try{history.replaceState(null,'','#'+v);}catch(e){location.hash=v;}}window.scrollTo(0,0);if(v==='hasil')requestAnimationFrame(()=>{const w=$('chart').clientWidth;if(w&&Math.abs(w-lastW)>40){lastW=w;hitung();}scrollHl();});}
document.addEventListener('click',e=>{const t=e.target.closest('[data-view],[data-go]');if(!t)return;go(t.dataset.view||t.dataset.go);});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
let rzT=null,lastW=0;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{const w=$('chart').clientWidth;if(w&&Math.abs(w-lastW)>40){lastW=w;hitung();}},250);});

/* --- data percobaan --- */
const cls=s=>'inp '+({ok:'okv',far:'bad',nan:'bad',empty:''}[s]);
let SET_OPEN={};
function grpDone(g){const st=g.vals.map(v=>cekNilai(v,g.sp));return st.length>0&&st.every(s=>s==='ok');}
function setOpen(g){return SET_OPEN[g.sp]!==undefined?SET_OPEN[g.sp]:!grpDone(g);}
function drawGroups(focusId){

function renderSug(sug,S){

  const rmin=Math.round(+$('rmin').value),rmax=Math.round(+$('rmax').value);

  let grid=[],tot1=0,manDone=0;
  if(T1.mode==='man'){grid=GROUPS.map(g=>g.sp).sort((a,b)=>a-b);tot1=grid.length;const inc=GROUPS.filter(g=>!grpDone(g)).map(g=>g.sp).sort((a,b)=>a-b);manDone=tot1-inc.length;sug=Object.assign({},sug,{t1:inc});}
  else{for(let s=Math.ceil(rmin/50)*50;s<=rmax;s+=50)grid.push(s);tot1=grid.length;sug=Object.assign({},sug,{t1:grid.filter(s=>!tested.has(s))});}
  const cur=sug.t1.length?1:sug.t2.length?2:sug.t3.length?3:0;
  const chips=arr=>`<div class="chips">${arr.slice(0,40).map(s=>`<button class="chip" data-sug="${s}">${s}</button>`).join('')}${arr.length>40?`<span class="muted" style="font-size:12px">${t('st.more',{n:arr.length-40})}</span>`:''}</div>`;
  const step=(no,title,desc,arr,key,doneTxt,waiting,extra)=>{const done=!arr.length&&!waiting;const open=STEP_OPEN[no]!==undefined?STEP_OPEN[no]:(cur===no);
    return `<div class="step${cur===no?' cur':''}${done?' done':''}${open?' open':''}" data-step="${no}"><span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
      <button type="button" class="step-h" data-tog="${no}" aria-expanded="${open}"><div class="tx"><div class="no">${t('st.no',{n:no})}</div><h3>${title}</h3><div class="st">${arr.length?`<span class="cnt">${key?t('st.n',{n:arr.length}):t('st1.nInc',{n:arr.length})}</span>`:(done?'✓ ':'')+doneTxt}</div></div><span class="chev"></span></button>
      <div class="step-b">${extra||''}<p>${desc}</p>${arr.length?chips(arr)+(key?`<button class="btn btn-sm${cur===no?' btn-pri':''}" data-all="${key}">${t('st.add',{n:arr.length})}</button>`:''):''}</div></div>`;};
  $('sugBox').innerHTML=
    step(1,t('st1.t'),(T1.mode==='man'?(tot1?t('st1.dMan',{n:tot1,d:manDone}):t('st1.dMan0')):t('st1.d')+(tot1?' '+t('st1.p',{d:tot1-sug.t1.length,t:tot1}):'')),sug.t1,T1.mode==='man'?'':'t1',T1.mode==='man'?t('st1.doneMan',{n:tot1}):t('st1.done'),T1.mode==='man'&&!tot1,
      `<div class="seg t1seg" style="margin-bottom:8px"><button data-t1mode="rec" aria-pressed="${T1.mode!=='man'}">${t('st1.rec')}</button><button data-t1mode="man" aria-pressed="${T1.mode==='man'}">${t('st1.man')}</button></div>`)+
    step(2,t('st2.t'),t('st2.d'),sug.t2,'t2',S.length<2?t('st.wait1'):t('st2.done'),S.length<2)+
    step(3,t('st3.t'),t('st3.d'),sug.t3,'t3',S.length<2?t('st.wait'):t('st3.done'),S.length<2);
  LAST.sug=sug;

function niceTicks(lo,hi,n){if(lo===hi){lo-=1;hi+=1}const s0=(hi-lo)/n,m=Math.pow(10,Math.floor(Math.log10(s0))),r=s0/m,st=(r<1.5?1:r<3?2:r<7?5:10)*m;const t=[];for(let v=Math.floor(lo/st)*st;v<=Math.ceil(hi/st)*st+st/2;v+=st)t.push(+v.toFixed(10));return t;}

    s+=`<line x1="${sx}" x2="${sx}" y1="${m.t}" y2="${H-m.b}" stroke="${C.pri}" stroke-width="1" stroke-dasharray="2 3" pointer-events="none"/>`;
    s+=`<g pointer-events="none"><rect x="${Math.min(W-m.r-lw,Math.max(m.l,sx-lw/2))}" y="${m.t-26}" width="${lw}" height="20" rx="10" fill="${C.pri}"/><text x="${Math.min(W-m.r-lw,Math.max(m.l,sx-lw/2))+lw/2}" y="${m.t-12}" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">${lbl}</text></g>`;}
  s+=`<text x="${W-m.r}" y="${H-4}" text-anchor="end" fill="${C.mute}" font-size="11" font-weight="500">${t('ax.x')} →</text><text x="4" y="14" text-anchor="start" fill="${C.mute}" font-size="11" font-weight="500">↑ ${t('ax.y')}</text></svg>`;
  $('chart').innerHTML=s+'<div id="ctip" class="ctip"></div>';
}
(function(){
  const box=$('chart');
  const show=(el,cx,cy)=>{const t=$('ctip');if(!t)return;t.innerHTML=TIPS[+el.dataset.t];t.style.display='block';
    const r=box.getBoundingClientRect(),tw=t.offsetWidth,th=t.offsetHeight;let x=cx-r.left+14,y=cy-r.top-th-12;
    if(x+tw>r.width)x=cx-r.left-tw-14;if(x<0)x=4;if(y<0)y=cy-r.top+16;t.style.left=x+'px';t.style.top=y+'px';
    box.querySelectorAll('.on-hover').forEach(e=>e.classList.remove('on-hover'));el.classList.add('on-hover');};
  const hide=()=>{const t=$('ctip');if(t)t.style.display='none';box.querySelectorAll('.on-hover').forEach(e=>e.classList.remove('on-hover'));};
  box.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const el=e.target.closest('[data-t]');if(el)show(el,e.clientX,e.clientY);else hide();});
  box.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')hide();});
  box.addEventListener('click',e=>{const el=e.target.closest('[data-t]');if(el)show(el,e.clientX,e.clientY);else hide();});
})();

/* --- render hasil --- */
const SAME_MM=2;
function groupRows(S){const rows=[];S.forEach(x=>{const r=rows[rows.length-1];
    if(r&&Math.abs(x.mean-r.avg)<=SAME_MM){r.b=x.sp;r.items.push(x);r.avg=r.items.reduce((q,i)=>q+i.mean,0)/r.items.length;r.min=Math.min(r.min,x.min);r.max=Math.max(r.max,x.max);r.n+=x.n;r.mMin=Math.min(r.mMin,x.mean);r.mMax=Math.max(r.mMax,x.mean);}
    else rows.push({a:x.sp,b:x.sp,items:[x],avg:x.mean,min:x.min,max:x.max,n:x.n,mMin:x.mean,mMax:x.mean});});return rows;}
const resTxt=r=>fmt(Math.round(r.avg),0);
const best=segs=>segs.length?segs.reduce((a,b)=>(b.b-b.a>a.b-a.a?b:a)):null;
function rangeTxt(sg){return sg.a===sg.b?fmt(sg.a,0):fmt(sg.a,0)+' ~ '+fmt(sg.b,0);}
function basis(sg){return sg.tested.length?(sg.endsTested?['ok',t('b.ok')]:['warn',t('b.part')]):['warn',t('b.est')];}
const eqTxt=f=>`${t('eq.res')} = ${fmt(f.b,5)} × ${t('eq.set')} ${f.a<0?'− '+fmt(-f.a,2):'+ '+fmt(f.a,2)}`;
const pill=(k,t)=>`<span class="pill p-${k}">${t}</span>`;
function render(){
  const S=stats(GROUPS),tolMin=+$('tolMin').value||0,tolPlus=+$('tolPlus').value||0;
  const rmin=Math.round(+$('rmin').value),rmax=Math.round(+$('rmax').value);
  if(!(rmax>=rmin))throw new Error(t('err.range'));
  const full=S.length>=2;
  $('hasilEmpty').classList.toggle('hidden',full);$('hasilFull').classList.toggle('hidden',!full);
  LAST={S};
  if(!full){renderSug(suggestions(S,rmin,rmax,[]),S);return;}
  const P=Math.round(+$('order').value);
  const M=makeModel(S,$('mode').value,rmin,rmax);Object.assign(LAST,{M,P,tolMin,tolPlus});
  const tgtMid=t=>t+(tolPlus-tolMin)/2;

  // KPI
  const totPot=S.reduce((s,x)=>s+x.n,0),maxVar=Math.max(...S.map(x=>x.range));
  $('kpis').innerHTML=[
    [t('kpi.tested'),S.length,t('x.range',{a:fmt(S[0].sp,0),b:fmt(S[S.length-1].sp,0)})],
    [t('kpi.total'),totPot,t('kpi.totalS')],
    [t('kpi.method'),M.use==='rumus'?t('m.rumus'):t('m.interp'),M.lurus?t('m.lurus'):t('m.tidak')],
    [t('kpi.var'),fmt(maxVar)+' mm',t('kpi.varS')]
  ].map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('');

  // cari pesanan
  if(P>0){
    const r=safeRange(S,P,tolMin,tolPlus,M);LAST.r=r;const sg=best(r.segs);
    let h='';
    if(sg){const [bk,bt]=basis(sg);
      h=`<div class="hero"><div class="l">${t('hero.put')}</div><div class="v">${rangeTxt(sg)} <small>mm</small></div>
        <div class="meta"><span>${t('hero.saran')}: <b>${fmt(sg.mid,0)} mm</b></span><span>${t('hero.acc',{a:fmt(r.lo,0),b:fmt(r.hi,0)})}</span>${pill(bk,bt)}</div></div>`;
      if(M.use==='rumus')h+=`<div class="formula">${t('eq.setting')} = (${fmt(tgtMid(P),1)} ${mn(M.fit.a)}) / ${fmt(M.fit.b,5)} = <b>${fmt((tgtMid(P)-M.fit.a)/M.fit.b,1)}</b></div>`;
      if(!sg.inData)h+=note(t('n.outData'));
      else if(!sg.endsTested)h+=note(t('n.ends',{a:fmt(sg.a,0),b:fmt(sg.b,0)}));
      if(r.segs.length>1)h+=note(t('n.other',{r:r.segs.filter(x=>x!==sg).map(rangeTxt).join(', ')}),'info');
      h+=`<div style="margin-top:12px"><button class="btn btn-sm" id="btnVerThis">${t('btn.verThis')}</button></div>`;
    }else{
      h=`<div class="hero bad"><div class="l">${t('hero.badHead',{p:fmt(P,0),a:fmt(r.lo,0),b:fmt(r.hi,0)})}</div><div class="v">${t('hero.none')}</div></div>`;
      h+=note(r.out?t('n.out',{p:fmt(P,0)}):t('n.noSafe',{a:fmt(r.lo,0),b:fmt(r.hi,0)}));
    }
    $('orderBox').innerHTML=h;
    const bv=$('btnVerThis');if(bv)bv.onclick=()=>{addVer(P,sg.mid);go('verifikasi');};
  }else{$('orderBox').innerHTML=note(t('n.fillOrder'),'info');LAST.r=null;}

  // model
  {const f=M.fit;
    let mh=`<div class="formula">${eqTxt(f)}</div>`;
    mh+=`<dl class="kv"><dt>${t('md.straight')}</dt><dd>${S.length<3?pill('gray',t('md.few')):M.lurus?pill('ok',t('md.lurus')):pill('warn',t('md.tidak'))}</dd>`;
    mh+=`<dt>${t('md.dev')}</dt><dd>${fmt(f.maxDev,1)} mm <span class="muted" style="color:var(--mute);font-weight:400">${t('md.limit',{l:LURUS_MAKS})}</span></dd>`;
    mh+=`<dt>R²</dt><dd>${fmt(f.r2,4)}</dd><dt>${t('md.used')}</dt><dd>${M.use==='rumus'?t('mode.rumus'):t('mode.interp')} <span style="color:var(--mute);font-weight:400">· ${$('mode').value==='auto'?t('md.auto'):t('md.manual')}</span></dd></dl>`;
    if(M.use==='rumus')mh+=note(t('md.noteR',{h:fmt((tolPlus-tolMin)/2,1),a:mn(f.a),b:fmt(f.b,5)}),'info');
    else if(S.length>=3)mh+=note(t('md.noteI'),'info');
    if($('mode').value==='rumus'&&!M.lurus&&S.length>=3)mh+=note(t('md.forced'));
    $('modelBox').innerHTML=mh;}

  // tabel dari data percobaan: setting berurutan dengan hasil sama (selisih rata-rata <= SAME_MM) digabung
  const rows=groupRows(S);LAST.rows=rows;
  const safe=r=>LAST.r&&r.min>=LAST.r.lo-1e-9&&r.max<=LAST.r.hi+1e-9;
  $('tblDesc').textContent=t('tbl.desc2',{s:S.length,n:S.reduce((q,x)=>q+x.n,0),d:SAME_MM});
  $('tblFoot').innerHTML=P>0&&LAST.r?t('tbl.foot2',{p:fmt(P,0),a:fmt(LAST.r.lo,0),b:fmt(LAST.r.hi,0)}):'';
  $('tblMain').innerHTML=`<thead><tr><th>${t('th.set')}</th><th>${t('th.res')}</th><th>${t('th.cuts')}</th><th class="num">${t('th.tested')}</th></tr></thead><tbody>`+rows.map(r=>
    `<tr${safe(r)?' class="hl"':''}><td class="strong">${r.a===r.b?fmt(r.a,0):fmt(r.a,0)+' ~ '+fmt(r.b,0)}</td><td class="strong">${resTxt(r)}</td><td class="muted">${fmt(r.min)} – ${fmt(r.max)}</td><td class="num muted">${t('tested.x',{s:r.items.length,n:r.n})}</td></tr>`).join('')+'</tbody>';
  scrollHl();
  renderSug(suggestions(S,rmin,rmax,[LAST.r]),S);
  drawChart(S,LAST.r||{segs:[],lo:NaN,hi:NaN},M);

  $('tblSum').innerHTML=`<thead><tr><th class="num">${t('ts.set')}</th><th class="num">${t('ts.n')}</th><th class="num">${t('ts.mean')}</th><th class="num">${t('ts.min')}</th><th class="num">${t('ts.max')}</th><th class="num">${t('ts.sel')}</th><th class="num">${t('ts.var')}</th><th></th></tr></thead><tbody>`+S.map(x=>{
    const vt=x.range<=2?['ok',t('v.ok')]:x.range<=5?['warn',t('v.mid')]:['bad',t('v.bad')];
    return `<tr><td class="num strong">${fmt(x.sp,0)}</td><td class="num">${x.n}/${x.total}</td><td class="num">${fmt(x.mean)}</td><td class="num">${fmt(x.min)}</td><td class="num">${fmt(x.max)}</td><td class="num">${sgn(x.sel)}</td><td class="num">${fmt(x.range)}</td><td>${pill(vt[0],vt[1])}</td></tr>`;}).join('')+'</tbody>';
}
function scrollHl(){const hl=document.querySelector('#tblMain tr.hl'),sc=hl&&hl.closest('.tw-scroll');if(sc&&sc.clientHeight){const d=hl.getBoundingClientRect().top-sc.getBoundingClientRect().top;sc.scrollTop=Math.max(0,sc.scrollTop+d-sc.clientHeight/2);}}
function hitung(){
  try{
    const nan=GROUPS.reduce((s,g)=>s+g.vals.filter(v=>cekNilai(v,g.sp)==='nan').length,0);
    $('msg').textContent=nan?t('err.nan',{n:nan}):'';
    render();updVers();
  }catch(e){toast(e.message,1);}
}

/* --- verifikasi --- */
function addVer(p,sp){let tgl='';try{tgl=new Date().toISOString().slice(0,10);}catch(e){}
  VERS.unshift({p:p||'',sp:sp||'',tgl,vals:Array(8).fill('')});drawVers();simpan();setTimeout(()=>{if($('v0_0'))$('v0_0').focus();},50);}
function drawVers(){
  $('verBody').innerHTML=VERS.length?VERS.map((v,vi)=>`<div class="set"><div class="set-h">
    <div class="field" style="width:130px"><label>${t('ver.order')}</label><div class="unit"><input class="inp" data-v="${vi}" data-f="p" type="number" step="1" value="${v.p}"></div></div>
    <div class="field" style="width:130px"><label>${t('ver.setting')}</label><div class="unit"><input class="inp" data-v="${vi}" data-f="sp" type="number" step="1" value="${v.sp}"></div></div>
    <div class="field" style="width:150px"><label>${t('ver.date')}</label><input class="inp" data-v="${vi}" data-f="tgl" type="date" value="${esc(v.tgl||'')}"></div>
    <div style="flex:1;align-self:flex-end;padding-bottom:6px" id="vk${vi}"></div>
    <button class="btn icon-btn" data-delv="${vi}" title="${t('toast.delVer')}" style="align-self:flex-end">${ICON_X}</button></div>
    <div class="cells">${v.vals.map((x,ci)=>`<label class="cell"><span>${t('cell',{n:ci+1})}</span><input id="v${vi}_${ci}" data-v="${vi}" data-c="${ci}" type="text" inputmode="decimal" autocomplete="off" value="${esc(x)}" class="inp"></label>`).join('')}</div></div>`).join('')
    :`<div class="empty"><b>${t('ver.emptyT')}</b>${t('ver.emptyX')}</div>`;
  $('cntVer').textContent=VERS.length;updVers();
}
function updVers(){
  const tolMin=+$('tolMin').value||0,tolPlus=+$('tolPlus').value||0;let L=0,G=0,B=0;
  VERS.forEach((v,vi)=>{const lo=v.p-tolMin,hi=v.p+tolPlus;let n=0,outN=0,nan=0;
    v.vals.forEach((x,ci)=>{const el=$('v'+vi+'_'+ci);if(!el)return;let c='';
      if(x!==''){const y=num(x);if(!isFinite(y)){nan++;c='bad';}else{n++;if(y<lo-1e-9||y>hi+1e-9){outN++;c='bad';}else c='okv';}}el.className='inp '+c;});
    const k=$('vk'+vi);let st;
    if(nan){st=pill('bad',t('vs.nan'));}
    else if(outN){st=pill('bad',t('vs.fail'))+` <span style="font-size:12.5px;color:var(--mute)">${t('vs.failX',{o:outN,n,a:fmt(lo,0),b:fmt(hi,0)})}</span>`;G++;}
    else if(n<v.vals.length){st=pill('gray',t('vs.part',{n,t:v.vals.length}));B++;}
    else{st=pill('ok',t('vs.pass'))+` <span style="font-size:12.5px;color:var(--mute)">${t('vs.passX',{a:fmt(lo,0),b:fmt(hi,0)})}</span>`;L++;}
    if(k)k.innerHTML=st;});
  $('verSum').innerHTML=VERS.length?`${pill('ok',t('vs.sumL',{n:L}))} ${pill('bad',t('vs.sumG',{n:G}))} ${pill('gray',t('vs.sumB',{n:B}))}`:'';
}
$('btnAddVer').onclick=()=>{const P=Math.round(+$('order').value);const sg=LAST.r?best(LAST.r.segs):null;addVer(P,sg?sg.mid:'');};
$('verBody').addEventListener('input',e=>{const t=e.target,vi=t.dataset.v;if(vi===undefined)return;const v=VERS[vi];
  if(t.dataset.f){v[t.dataset.f]=t.dataset.f==='tgl'?t.value:Math.round(+t.value);}else v.vals[t.dataset.c]=t.value.trim();updVers();simpan();});
$('verBody').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;if(t.dataset.c===undefined)return;e.preventDefault();const nx=$('v'+t.dataset.v+'_'+(+t.dataset.c+1));if(nx)nx.focus();});
$('verBody').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.delv===undefined)return;VERS.splice(+b.dataset.delv,1);drawVers();simpan();toast(t('toast.delVer'));});

/* --- salin --- */
$('btnCopy').onclick=()=>{if(!LAST.rows)return;
  const txt=[t('th.set'),t('th.res'),t('th.cuts'),t('th.tested')].join('\t')+'\n'+LAST.rows.map(r=>[r.a===r.b?r.a:r.a+' ~ '+r.b,resTxt(r),fmt(r.min)+' – '+fmt(r.max),t('tested.x',{s:r.items.length,n:r.n})].join('\t')).join('\n');
  try{navigator.clipboard.writeText(txt).then(()=>toast(t('toast.copied')),()=>toast(t('toast.copyFail'),1));}catch(e){toast(t('toast.copyFail'),1);}};

/* --- simpan, contoh, auto --- */
const FIELDS=['tolMin','tolPlus','rmin','rmax','order','mode'];
const OLD_FIELDS=['tolMin','tolPlus','rmin','rmax','rstep','order','mode'];
function simpan(){try{localStorage.setItem('kmp3',JSON.stringify({g:GROUPS,v:VERS,c:isContoh,fo:Object.fromEntries(FIELDS.map(i=>[i,$(i).value]))}));}catch(e){}}
function muat(){try{const j=JSON.parse(localStorage.getItem('kmp3')||localStorage.getItem('kmp2')||'null');if(!j)return false;if(Array.isArray(j.g))GROUPS=j.g;if(Array.isArray(j.v))VERS=j.v;isContoh=!!j.c;const fo=j.fo||(Array.isArray(j.f)?Object.fromEntries(OLD_FIELDS.map((i,k)=>[i,j.f[k]])):{});FIELDS.forEach(i=>{if(fo[i]!=null&&fo[i]!=='')$(i).value=fo[i];});return true;}catch(e){return false;}}
function contoh(){
  let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const mesin=s=>s<1770?s:Math.floor(s/50)*50+50;
  GROUPS=[];for(let s=1000;s<=3000;s+=50){const v=[];for(let i=0;i<8;i++)v.push(String(Math.round((mesin(s)+rnd()*3)*2)/2));GROUPS.push({sp:s,vals:v});}
  $('rmin').value=1000;$('rmax').value=3000;
  drawGroups();
}
function setBanner(){$('banner').classList.toggle('hidden',!isContoh);const b=$('dataBadge');b.className='pill '+(isContoh?'p-warn':'p-ok');b.textContent=isContoh?t('badge.sample'):t('badge.user');}
function changed(){isContoh=false;setBanner();simpan();clearTimeout(tAuto);tAuto=setTimeout(hitung,300);}
FIELDS.forEach(id=>{$(id).addEventListener('input',()=>{simpan();clearTimeout(tAuto);tAuto=setTimeout(hitung,300);});$(id).addEventListener('change',()=>{simpan();hitung();});});
if(!muat()||isContoh){contoh();isContoh=true;}
function setLang(l){if(!I18N[l])return;LANG=l;try{localStorage.setItem('kmp_lang',l);}catch(e){}applyStatic();
  const b=$('btnClear');b.classList.remove('arm');b.textContent=t('btn.clear');drawGroups();drawVers();setBanner();hitung();}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
applyStatic();drawGroups();drawVers();setBanner();hitung();go(location.hash.slice(1)||'hasil');
</script>
